[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
 
addopts =
    --tb=short
    --no-header
    -q
 
# Treat asyncio tests correctly
asyncio_mode = auto
 
# Show slowest tests
# addopts = --durations=10
 
markers =
    integration: live API tests (require internet, use RUN_INTEGRATION=1)